<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0A0A0C; --panel:#16181D; --line:rgba(240,240,248,.14); --tx:#EDEFF4; --dim:#8A9099; --gold:#D4AF37; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 330px; background: var(--bg); color: var(--tx); font: 13px/1.5 system-ui, 'Segoe UI', sans-serif; padding: 14px; }
  .head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #5A6470; flex: none; }
  .dot.on { background: #2FA84F; box-shadow: 0 0 8px #2FA84F88; }
  .dot.off { background: #5A6470; }
  .dot.warn { background: #D4AF37; }
  h1 { font-size: 13.5px; font-weight: 700; letter-spacing: .04em; }
  .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 10px; }
  .mode { font-weight: 700; font-size: 13px; }
  .addr { color: var(--gold); font-family: ui-monospace, Consolas, monospace; font-size: 12px; margin-top: 3px; word-break: break-all; }
  .hint { color: var(--dim); font-size: 11.5px; margin-top: 6px; line-height: 1.45; }
  .hint b { color: var(--tx); }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  button { flex: 1; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); font: 700 12px/1 system-ui, sans-serif; cursor: pointer; transition: .15s; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #14100A; border-color: var(--gold); }
  button.ghost { color: var(--dim); }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .links { display: flex; gap: 12px; font-size: 11.5px; color: var(--dim); }
  .err { color: #E07A7A; font-size: 11.5px; margin-top: 6px; display: none; }
</style>
</head>
<body>
  <div class="head">
    <div class="dot off" id="dot"></div>
    <div>
      <h1>АНТИЦЕНЗОР — СУВЕРЕННЫЙ УЗЕЛ</h1>
      <div class="sub" id="state">проверяю…</div>
    </div>
  </div>

  <div class="panel">
    <div class="mode" id="modeName">—</div>
    <div class="addr" id="modeAddr"></div>
    <div class="hint" id="modeHint"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="row">
    <button id="toggle" class="primary">ВКЛЮЧИТЬ</button>
    <button id="settings">НАСТРОЙКИ</button>
  </div>
  <div class="row" id="presetRow" style="display:none">
    <button id="preset" class="ghost" style="flex:2">Работает сразу: публичный «АнтиЗапрет»</button>
  </div>

  <div class="links">
    <a href="https://2ip.ru/" target="_blank">проверка IP</a>
    <a href="https://bash.ws/dnsleak" target="_blank">проверка DNS</a>
    <a href="#" id="pacCheck">свой PAC</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
