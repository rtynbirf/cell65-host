<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CELL-65 Поле 8x8 :: импорт списка</title>
<link rel="stylesheet" href="popup.css">
<style>
  body { width: 560px; margin: 0 auto; padding: 0 0 20px; }
  h1 { font-size: 16px; padding: 12px 14px 4px; }
  p.note { color: var(--dim); font-size: 12px; padding: 0 14px 10px; }
  .wrap { padding: 0 14px; }
  textarea {
    width: 100%; height: 180px; background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    font: 12px Consolas, monospace; resize: vertical;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .row input[type=file] { color: var(--dim); font-size: 12px; flex: 1; }
  #msg { margin-top: 10px; font-size: 12px; min-height: 18px; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: #f87171; }
  .cur { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<h1><span class="b65">65</span> Импорт списка серверов</h1>
<p class="note">
  Источник файла: <b>CELL65\data\servers_export.json</b> - его создаёт клетка d6
  (меню [3], «ПРОБА И ВЫБОР»). Порядок уже отсортирован: вне РФ, кольцо дистанции
  от СПБ, затем скорость HTTP-204. Ручное переключение - клик по строке в попапе.
</p>
<div class="wrap">
  <textarea id="txt" placeholder="...либо вставь содержимое servers_export.json сюда"></textarea>
  <div class="row">
    <input type="file" id="file" accept=".json,application/json">
    <button id="btnFile" class="btn cyan" style="flex:0 0 auto">Импорт из файла</button>
  </div>
  <div class="row">
    <button id="btnPaste" class="btn cyan">Импорт из текста</button>
    <button id="btnClear" class="btn ghost">Очистить список</button>
    <button id="btnDirect" class="btn ghost">Выключить прокси</button>
  </div>
  <div id="msg"></div>
  <div class="cur" id="cur"></div>
</div>
<script src="options.js"></script>
</body>
</html>
